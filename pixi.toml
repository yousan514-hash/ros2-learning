[workspace]
name = "ros2-learning"
description = "ROS 2 Jazzy の学習記録（Windows ネイティブ / RoboStack）"
channels = ["https://prefix.dev/robostack-jazzy", "https://prefix.dev/conda-forge"]
platforms = ["win-64"]

[tasks]
build = "colcon build --merge-install"
talker = "cmd /c \"call install\\local_setup.bat && ros2 run py_pubsub talker\""
listener = "cmd /c \"call install\\local_setup.bat && ros2 run py_pubsub listener\""
# Windows の Visual C++ ランタイムが古いと C++ のノードが落ちるので、環境の新しいランタイムを
# exe の隣に置く（LOG.md の 2026-11-02 と 2026-11-03 を参照）。C++ を使うタスクは先にこれを実行する
vcrt_local = "python tools/vcrt_local.py"
talker_cpp = { cmd = "ros2 run demo_nodes_cpp talker", depends-on = ["vcrt_local"] }
turtlesim = { cmd = "ros2 run turtlesim turtlesim_node", depends-on = ["vcrt_local"] }
turtle_draw = "cmd /c \"call install\\local_setup.bat && ros2 run py_pubsub turtle_draw\""
# turtlesim を起動せずに、turtle_draw の制御を同じ動きの式で確かめる
check_turtle_draw = "python tools/check_turtle_draw.py"
# 双腕の外観検査セル（src/dual_arm_inspection）。RViz で動きと判定を見る。先に pixi run build
dual_arm = { cmd = "cmd /c \"call install\\local_setup.bat && ros2 launch dual_arm_inspection dual_arm_inspection.launch.py\"", depends-on = ["vcrt_local"] }
# GUI なしで確かめる: 逆運動学・上下限・腕どうしの距離・検査の当たり外れ（200 枚）→ docs/dual_arm_inspection.png
check_dual_arm = "python tools/check_dual_arm.py"
test_dual_arm = "python -m pytest src/dual_arm_inspection/test -q"
# Isaac Sim に読み込む URDF を作る（机などを外した版）→ src/dual_arm_inspection/isaac/out/dual_arm.urdf
dual_arm_urdf = "python src/dual_arm_inspection/isaac/export_urdf.py"
# Isaac Sim で撮った画像（isaac/out/good と isaac/out/test）を判定し、疑似画像と比べる絵を docs/ に作る
isaac_judge = "python src/dual_arm_inspection/isaac/judge_folder.py --good src/dual_arm_inspection/isaac/out/good --test src/dual_arm_inspection/isaac/out/test --json src/dual_arm_inspection/isaac/out/judge.json"
isaac_figure = { cmd = "python src/dual_arm_inspection/isaac/make_compare_figure.py", depends-on = ["isaac_judge"] }
# 稼働台帳（src/robot_ledger）のテスト
test_ledger = "python -m pytest src/robot_ledger/test -q"
# 検査の台帳の通しの見本: 双腕セルの判定（Isaac Sim 162 枚・疑似画像 200 枚）を署名つきの台帳にし、
# 工場の受け取りの署名と使用範囲書で請求額を出し、改ざんを見抜き、peaq の記録の形に書き出す → ledger/inspection_demo/
inspection_ledger_demo = "python tools/inspection_ledger_demo.py"

[activation.env]
# 日本語を含むファイルや環境変数を、colcon が cp932 で読んで落ちるのを防ぐ
PYTHONUTF8 = "1"

[dependencies]
python = "3.12.*"
ros-jazzy-ros-base = "*"
ros-jazzy-turtlesim = "*"
ros-jazzy-demo-nodes-cpp = "*"
ros-jazzy-demo-nodes-py = "*"
colcon-common-extensions = "*"
setuptools = "<=79.0.1"
ros-jazzy-rviz2 = ">=14.1.24,<15"
ros-jazzy-xacro = ">=2.1.1,<3"
ros-jazzy-joint-state-publisher = ">=2.4.3,<3"
opencv = ">=5.0.0,<6"
